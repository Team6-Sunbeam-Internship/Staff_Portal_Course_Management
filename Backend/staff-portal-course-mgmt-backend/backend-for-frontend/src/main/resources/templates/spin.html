<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Portal - Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner-container {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .spinner-text {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 1rem;
        }
        .spinner-subtext {
            color: #666;
            font-size: 0.9em;
        }
    </style>
    <!--<script>
        setTimeout(function () {
            if (window.location.pathname === "/spin") {
                window.location.href = "/dashboard";
            }
        }, 5000);
    </script>-->
</head>
<body>
<div class="spinner-container">
    <h2>Staff Portal Course Management System</h2>
    <div class="spinner"></div>
    <div class="spinner-text">Processing your login...</div>
    <div class="spinner-subtext">
        Please wait while we complete the authentication process
    </div>
</div>
</body>
</html>
