<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFF - Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #ff7b7b 0%, #d63031 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-container { background: white; padding: 3rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; max-width: 500px; }
        .error-icon { font-size: 4rem; color: #d63031; margin-bottom: 1rem; }
        .error-title { color: #333; margin-bottom: 1rem; font-size: 2rem; }
        .error-message { color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .error-code { color: #999; font-size: 0.9em; margin-bottom: 2rem; }
        .back-button { display: inline-block; padding: 12px 24px; background: #4285f4; color: white; text-decoration: none; border-radius: 5px; transition: background 0.3s; }
        .back-button:hover { background: #357ae8; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1 class="error-title">Oops! Something went wrong</h1>
    <p class="error-message" th:text="${errorMessage}">An unexpected error occurred while processing your request.</p>
    <p class="error-code">Error Code: <span th:text="${statusCode}">500</span></p>
    <a href="/login" class="back-button">Return to Login</a>
</div>
</body>
</html>
