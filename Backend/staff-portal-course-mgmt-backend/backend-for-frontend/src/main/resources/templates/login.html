<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Portal - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #333;
            margin: 0;
        }
        .login-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 1rem;
            transition: background 0.3s;
        }
        .login-button:hover {
            background: #357ae8;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            border: 1px solid #bee5eb;
        }
        .session-expired-banner {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Staff Portal Login</h1>
        <p>Sign in to access your account</p>
    </div>
    <div th:if="${param.error}" class="error-message">
        <span>Login failed. Please check your credentials and try again.</span>
    </div>
    <div th:if="${param.logout}" class="info-message">
        <span>You have been logged out successfully.</span>
    </div>
    <div th:if="${session.sessionExpired}" class="session-expired-banner">
				<span
                >Your session expired. Please log in again to continue where you left
					off.</span
                >
    </div>
    <a th:href="${authServerLoginUrl}" class="login-button">
        Sign in
    </a>
    <div
            style="text-align: center; margin-top: 2rem; color: #666; font-size: 0.9em;"
    >
        <p>Secure login powered by OAuth 2.0</p>
    </div>
</div>
</body>
</html>
