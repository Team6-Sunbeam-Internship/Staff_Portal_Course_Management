server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        name: __Host-bff-session
        secure: true
        same-site: none
        max-age: 3600
        http-only: true
      tracking-modes: cookie
spring:
  application:
    name: backend-for-frontend
    group: com.team6
  profiles:
    active: ${ACTIVE_PROFILE}
  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  session:
    redis:
      flush-mode: on_save
      namespace: bff:spring:session
      save-mode: on_set_attribute
    timeout: 30m

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # This specific line will show "Will not generate CSRF token" or "Invalid CSRF token found"
    org.springframework.security.web.csrf: DEBUG
    # This will show you the session details to see if the session is changing
    org.springframework.security.web.session: DEBUG
    com:
      staff_portal.backend_for_frontend: DEBUG