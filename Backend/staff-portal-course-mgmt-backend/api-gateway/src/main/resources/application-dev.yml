server:
  port: ${SERVER_PORT}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OAUTH2_RESOURCE_SERVER_JWT_JWK_SET_URI}
          issuer-uri: ${OAUTH2_RESOURCE_SERVER_JWT_ISSUER_URI}
          clock-skew: ${OAUTH2_RESOURCE_SERVER_JWT_CLOCK_SKEW}

gateway:
  services:
    user-service:
      url: ${GATEWAY_SERVICES_USER_SERVICE}
      audience: ${GATEWAY_SERVICES_USER_SERVICE_AUDIENCE}
      timeout: 30s
      retry:
        max-attempts: 3
    scheduling-service:
      url: ${GATEWAY_SERVICES_SCHEDULING_SESSION_TIMESHEET_SERVICE}
      audience: ${GATEWAY_SERVICES_SCHEDULING_SERVICE_AUDIENCE}
      timeout: 30s
      retry:
        max-attempts: 3
    academic-service:
      url: ${GATEWAY_SERVICES_ACADEMIC_SERVICE}
      audience: ${GATEWAY_SERVICES_ACADEMIC_SERVICE_AUDIENCE}
      timeout: 30s
      retry:
        max-attempts: 3
    auth-service:
      url: ${GATEWAY_SERVICES_AUTH_SERVICE}
      audience: ${GATEWAY_SERVICES_AUTH_SERVICE_AUDIENCE}
      timeout: 10s
      retry:
        max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.staff_portal.api_gateway: TRACE
    org.springframework.security: TRACE
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet.mvc: TRACE
    io.github.resilience4j: DEBUG
  file:
    name: logs/api-gateway-dev.log

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        waitDurationInOpenState: 10s
        failureRateThreshold: 30
      scheduling-service:
        waitDurationInOpenState: 10s
        failureRateThreshold: 30
      academic-service:
        waitDurationInOpenState: 10s
        failureRateThreshold: 30
