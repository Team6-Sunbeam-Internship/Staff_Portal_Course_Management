server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        name: AS_SESSION
        secure: true
        same-site: none
        max-age: 2h
        http-only: true
        domain: localhost:8001
spring:
  application:
    name: auth-service
    group: com.team6
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    profiles:
      active: dev

  logging:
    level:
      org:
        springframework:
          web: DEBUG
          security: DEBUG