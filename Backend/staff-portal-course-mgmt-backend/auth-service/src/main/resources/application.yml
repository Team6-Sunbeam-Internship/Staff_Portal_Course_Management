server:
  port: ${SERVER_PORT}

spring:
  application:
    name: auth-service
    group: com.team6
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    profiles:
      active: dev

  logging:
    level:
      org:
        springframework:
          web: DEBUG
          security: DEBUG