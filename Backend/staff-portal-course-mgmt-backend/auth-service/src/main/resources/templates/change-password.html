<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Change</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error {
            color: #dc3545;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .success {
            color: #155724;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .demo-users {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .demo-users h4 {
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .demo-users p {
            color: #6c757d;
            margin-bottom: 0.25rem;
        }

        .demo-users strong {
            color: #495057;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Please change your password</p>
    </div>

    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <div th:if="${logoutMessage}" class="success" th:text="${logoutMessage}"></div>

    <form th:action="@{/force-change-password}" method="post" onsubmit="return validatePasswords()">
        <div class="form-group">
            <label for="old_password">Old Password</label>
            <input type="text" id="old_password" name="oldPassword" required
                   placeholder="Enter your old password">
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="newPassword" required
                   placeholder="Enter new password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirmPassword" required
                   placeholder="Enter new password again">
        </div>
        <!-- Client or Server side error -->
        <div id="clientError" class="error" style="color:red;"
             th:if="${errorMessage != null}">
            <span th:text="${errorMessage}"></span>
        </div>
        <button type="submit" class="login-btn">Submit</button>
    </form>

    <script>
        function validatePasswords() {
            const newPassword = document.getElementById("new_password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const clientError = document.getElementById("clientError");

            if (newPassword !== confirmPassword) {
                clientError.style.display = "block";
                clientError.innerText = "New Password and confirm password do not match";
                return false; // stop form submission
            }

            clientError.style.display = "none"; // clear if matched
            return true; // allow to submit
        }
    </script>
</div>

</body>
</html>
