<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Change Password</title>
    <link th:href="@{/output.css}" rel="stylesheet"/>
    <style>
        /* Modern CSS Variables - Theme Definitions */
        :root {
            --bg-body: #ffffff;
            --zinc-100: #f8fafc;
            --zinc-200: #f1f5f9;
            --zinc-300: #e2e8f0;
            --zinc-800: #1e293b;
            --zinc-900: #0f172a;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #2dd4bf 100%);
            --horizon-color: linear-gradient(90deg, #f59e0b, #d946ef);
            --horizon-glow: rgba(217, 70, 239, 0.4);
            --card-bg: #ffffff;
            --card-border: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --meteor-color: rgba(217, 70, 239, 0.4);
            --input-bg: #f8fafc;
            --focus-ring: #d946ef;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;

            /* Gradient Toast Backgrounds */
            --toast-success-bg: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
            --toast-error-bg: linear-gradient(135deg, #b91c1c 0%, #ef4444 50%, #f87171 100%);
            --toast-warning-bg: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%);
            --toast-text: #ffffff;
        }

        .dark {
            --bg-body: #020203;
            --card-bg: #09090b;
            --card-border: #18181b;
            --text-main: #ffffff;
            --text-muted: #71717a;
            --accent-gradient: linear-gradient(135deg, #27272a 0%, #000000 100%);
            --horizon-color: #ffffff;
            --horizon-glow: rgba(255, 255, 255, 0.6);
            --meteor-color: #ffffff;
            --input-bg: #000000;
            --focus-ring: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s ease,
                        color 0.4s ease,
                        box-shadow 0.4s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-body);
            overflow: hidden;
            position: relative;
        }

        /* --- Stacked Toast Styles --- */
        #toast-container {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            position: absolute;
            min-width: 360px;
            padding: 14px 16px 14px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            color: var(--toast-text);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            transition:
                transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                opacity 0.4s ease;
            transform-origin: top center;
            cursor: pointer;
            user-select: none;
        }

        /* Status Gradient Backgrounds */
        .toast-success { background: var(--toast-success-bg); }
        .toast-error { background: var(--toast-error-bg); }
        .toast-warning { background: var(--toast-warning-bg); }

        .toast-enter {
            opacity: 0;
            transform: translateY(-40px) scale(0.8) !important;
        }

        .toast-exit {
            opacity: 0 !important;
            transform: translateY(-40px) scale(0.8) !important;
            pointer-events: none;
        }

        .toast-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        .toast-message {
            flex-grow: 1;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .toast-close {
            background: transparent;
            border: none;
            color: white;
            opacity: 0.6;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: opacity 0.2s, background 0.2s;
        }

        .toast-close:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- Meteor Shower --- */
        .night-sky {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: transparent;
            transform: rotateZ(45deg);
        }

        .meteor {
            position: absolute;
            top: -100px;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, var(--meteor-color) 100%);
            border-radius: 999px;
            animation: shower var(--duration) linear infinite;
            opacity: 0;
        }

        @keyframes shower {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.6; }
            100% { transform: translateY(120vh); opacity: 0; }
        }

        /* --- THE HORIZON LINE --- */
        .horizon-wrapper {
            position: relative;
            padding-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .horizon-line {
            width: 400px;
            height: 4px;
            background: var(--horizon-color);
            margin-top: 40px;
            position: relative;
            z-index: 5;
            clip-path: polygon(0% 50%, 50% 0%, 100% 50%, 50% 100%);
            animation: glowPulse 3s infinite ease-in-out;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 10px var(--horizon-glow); filter: brightness(0.8); }
            50% { box-shadow: 0 0 25px var(--horizon-glow); filter: brightness(1.3); }
        }

        /* --- Login Card --- */
        .glass-card {
            width: 400px;
            max-width: 90vw;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .card-header {
            background: var(--accent-gradient);
            padding: 1.5rem 1.5rem;
            text-align: center;
            color: white;
        }

        .card-header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.04em; }
        .card-header p { opacity: 0.8; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4em; }

        .form-body { padding: 2.5rem; }
        .form-group { margin-bottom: 1.5rem; }

        .label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; }

        .input-container { position: relative; display: flex; align-items: center; }

        .input-field {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            outline: none;
        }

        .input-field:focus { border-color: var(--focus-ring); box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.1); }

        /* --- Fix for browser autofill white background --- */
        .input-field:-webkit-autofill,
        .input-field:-webkit-autofill:hover,
        .input-field:-webkit-autofill:focus,
        .input-field:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-icon { position: absolute; left: 1rem; width: 20px; height: 20px; color: var(--text-muted); pointer-events: none; }

        .password-toggle {
            position: absolute; right: 1rem;
            background: none; border: none;
            color: var(--text-muted); cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 1.1rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
        }

        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }

        .theme-switch-container { position: fixed; bottom: 30px; right: 30px; z-index: 100; }

        .theme-switch-btn {
            width: 56px; height: 56px; border-radius: 18px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-main); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="dark">
<div id="toast-container"></div>
<div class="night-sky" id="meteor-container"></div>
<!-- Theme Toggle Button -->
<div class="theme-switch-container">
    <button class="theme-switch-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
            <span id="theme-icon-slot">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path
                        d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
    </button>
</div>

<!-- Login Card -->
<div class="horizon-wrapper">
    <main class="glass-card">
        <div class="card-header">
            <h1>Welcome Back</h1>
            <p>Please change your password</p>
        </div>
        <!-- Form Body -->
        <div class="form-body">

            <!-- Login Form -->
            <form id="password-change-form" th:action="@{/force-change-password}" onsubmit="return validatePassword()" method="post" novalidate>

                <!-- Old Password Field -->
                <div class="form-group">
                    <label for="old-password">Old Password</label>
                    <div class="input-container">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="old-password" name="oldPassword" class="input-field" placeholder="Enter your old password..."
                               autocomplete="current-password">
                    </div>
                </div>

                <!-- New Password Field -->
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="input-container">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="new-password" name="newPassword" class="input-field" placeholder="••••••••"
                               autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                                <span id="new-password-toggle-icon">
                                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                                </span>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-container">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="confirm-password" name="confirmPassword" class="input-field" placeholder="••••••••"
                               autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="toggleConfirmPassword()">
                                <span id="confirm-password-toggle-icon">
                                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                                </span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="login-btn">Submit</button>
            </form>
        </div>
    </main>
    <div class="horizon-line"></div>
</div>

<script th:inline="javascript">
    const activeToasts = [];
    const MAX_TOASTS = 5;

    function updateToastStack() {
        activeToasts.forEach((toast, index) => {
            if (toast.classList.contains('toast-exit')) return;
            const offset = index * 14;
            const scale = 1 - (index * 0.05);
            const opacity = 1 - (index * 0.3);
            toast.style.transform = `translateY(${offset}px) scale(${scale})`;
            toast.style.opacity = opacity;
            toast.style.zIndex = 1000 - index;
        });
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type} toast-enter`;

        let iconMarkup = type === 'success'
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`
            : type === 'error'
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

        toast.innerHTML = `
            <div class="toast-icon">${iconMarkup}</div>
            <div class="toast-message">${message}</div>
            <button class="toast-close" title="Dismiss">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        `;

        toast.querySelector('.toast-close').addEventListener('click', (e) => {
            e.stopPropagation();
            dismissToast(toast);
        });

        toast.addEventListener('click', () => dismissToast(toast));

        activeToasts.unshift(toast);
        container.prepend(toast);

        setTimeout(() => {
            toast.classList.remove('toast-enter');
            updateToastStack();
        }, 10);

        if (activeToasts.length > MAX_TOASTS) {
            const oldestToast = activeToasts.pop();
            removeToastElement(oldestToast);
        }

        setTimeout(() => dismissToast(toast), 4000);
    }
    function dismissToast(toast) {
        const index = activeToasts.indexOf(toast);
        if (index > -1) {
            activeToasts.splice(index, 1);
            removeToastElement(toast);
        }
    }

    function removeToastElement(toast) {
        if (toast.classList.contains('toast-exit')) return;
        toast.classList.add('toast-exit');
        updateToastStack();
        setTimeout(() => toast.remove(), 500);
    }


    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        const iconSlot = document.getElementById('theme-icon-slot');
        if(isDark){
            iconSlot.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>`;
        } else {
            iconSlot.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
        }
        localStorage.setItem("staff-portal-theme", isDark ? 'dark' : 'light');
    }

    function togglePassword() {
        const input = document.getElementById('new-password');
        const iconContainer = document.getElementById('new-password-toggle-icon');
        if(input.type === 'password'){
            input.type = 'text';
            iconContainer.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
        } else {
            input.type = 'password';
            iconContainer.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off-icon lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
        }
    }

    function toggleConfirmPassword() {
        const input = document.getElementById('confirm-password');
        const iconContainer = document.getElementById('confirm-password-toggle-icon');
        if(input.type === 'password'){
            input.type = 'text';
            iconContainer.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
        } else {
            input.type = 'password';
            iconContainer.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off-icon lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
        }
    }

    function validatePassword() {
        const oldPassword = document.getElementById("old-password").value.trim();
        const newPassword = document.getElementById("new-password").value.trim();
        const confirmPassword = document.getElementById("confirm-password").value.trim();

        if(!oldPassword && !newPassword && !confirmPassword) {
            showToast('Please, fill all fields first', 'warning');
            return false;
        }

        if (!oldPassword) {
            showToast('Old password is required', 'warning');
            return false;
        }

        if(!newPassword){
            showToast('New Password is required', 'warning');
            return false;
        }

        if(!confirmPassword){
        	showToast('Confirm Password is required', 'warning');
        	return false;
        }

        if(oldPassword === newPassword){
        	showToast('Your new password is same as old password, Please fill different password', 'warning');
        	return false;
        }

        if(newPassword !== confirmPassword){
        showToast('New Password and Confirm Password do not match.', 'warning');
        return false;
        }

        return true;
    }

    function createMeteors() {
        const container = document.getElementById('meteor-container');
        for (let i = 0; i < 15; i++) {
            const m = document.createElement('div');
            m.className = 'meteor';
            m.style.left = Math.random() * 100 + '%';
            m.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            m.style.animationDelay = Math.random() * 10 + 's';
            container.appendChild(m);
        }
    }
        window.onload = function() {
            createMeteors();

            const savedTheme = localStorage.getItem("staff-portal-theme");
            console.log("Saved Theme: ", savedTheme);
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            const errorMsg = /*[[${errorMessage}]]*/ null;
            if (errorMsg) showToast(errorMsg, 'error');
        };
</script>
</body>
</html>
